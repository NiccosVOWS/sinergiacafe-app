<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pedidos — SIGESCA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />


    <style>
        .items-list { display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto; }
        .item-row { display:flex; gap:8px; align-items:center; }
        .item-row select { flex:1; }
        .item-subtotal { min-width:80px; text-align:right; font-size:13px; font-weight:500; }
        .item-remove { flex-shrink:0; padding:8px; background:none; border:1.5px solid #D9D3C7; border-radius:6px; cursor:pointer; color:#991B1B; }
        .item-remove:hover { background:#FEE2E2; }
        .btn-add-row { margin-top:8px; padding:8px 14px; background:none; border:1.5px dashed #D9D3C7; border-radius:6px; font-family:'Inter',sans-serif; font-size:13px; color:#7A7068; cursor:pointer; width:100%; }
        .btn-add-row:hover { border-color:var(--verde-medio); color:var(--verde-medio); }
        .total-line { display:flex; justify-content:space-between; align-items:baseline; padding-top:14px; margin-top:6px; border-top:1px solid #EDE8DF; font-size:13px; color:#7A7068; }
        .total-line strong { font-family:'Playfair Display',serif; font-size:22px; color:var(--grafito); }
    </style>
</head>
<body data-page="pedidos">
<aside class="sidebar" id="sidebar-root"></aside>

<main class="main-content">
    <div class="page-header">
        <div>
            <h1>Pedidos</h1>
            <p>Registro y seguimiento de pedidos de Sinergia Café</p>
        </div>
        <button class="btn-primary" id="btnNuevo">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nuevo pedido
        </button>
    </div>

    <div class="filters">
        <div class="search-wrapper">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Buscar por ID o cliente…" />
        </div>
        <select class="filter-select" id="filterEstado">
            <option value="">Todos los estados</option>
        </select>
        <span class="count-label" id="countLabel"></span>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr><th>ID</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Observaciones</th><th></th></tr>
            </thead>
            <tbody id="pedidosBody">
            <tr><td colspan="7" style="text-align:center;padding:40px;color:#A09890;">Cargando…</td></tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Modal crear -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" style="max-width:560px;">
        <h2 class="modal-title">Nuevo pedido</h2>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Cliente</label>
                <select class="form-input" id="fCliente"><option value="">— Sin cliente —</option></select>
            </div>
            <div class="form-group">
                <label class="form-label">Estado inicial *</label>
                <select class="form-input" id="fEstado"></select>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Productos *</label>
            <div class="items-list" id="itemsList"></div>
            <button type="button" class="btn-add-row" id="btnAddItem">+ Agregar producto</button>
        </div>
        <div class="form-group">
            <label class="form-label">Observaciones</label>
            <input type="text" class="form-input" id="fObservaciones" placeholder="Ej: Sin azúcar, para llevar…" />
        </div>
        <div class="total-line"><span>Total del pedido</span><strong id="totalPedido">S/ 0.00</strong></div>
        <div class="modal-actions">
            <button class="btn-secondary" id="btnCancelar">Cancelar</button>
            <button class="btn-primary" id="btnGuardar">Guardar</button>
        </div>
    </div>
</div>

<!-- Cambiar estado -->
<div class="patch-overlay" id="patchOverlay">
    <div class="patch-box">
        <h3>Cambiar estado</h3>
        <input type="hidden" id="patchId" />
        <div class="form-group">
            <label class="form-label">Nuevo estado</label>
            <select class="form-input" id="patchEstado"></select>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" id="patchCancelar">Cancelar</button>
            <button class="btn-primary" id="patchGuardar">Actualizar</button>
        </div>
    </div>
</div>

<!-- Confirm eliminar -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <h3>Eliminar pedido</h3>
        <p>¿Seguro que deseas eliminar este pedido? Esta acción no se puede deshacer.</p>
        <div style="display:flex;gap:10px;justify-content:center;">
            <button class="btn-secondary" id="confirmCancelar">Cancelar</button>
            <button class="btn-danger" id="confirmEliminar">Eliminar</button>
        </div>
    </div>
</div>



<div class="toast" id="toast"></div>
<script src="../components/sidebar.js"></script>
<script>
    const GATEWAY = 'http://localhost:8080';
    const headers = getHeaders();
        let pedidos = [], clientes = [], estados = [], productos = [], totales = {}, deleteId = null;

    // El estado viene de la BD, así que el color se decide por su nombre
    function badgeFor(nombre) {
      const k = (nombre || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (k.includes('entreg') || k.includes('complet') || k.includes('list')) return 'badge-entregado';
      if (k.includes('prepar') || k.includes('proces')) return 'badge-preparacion';
      if (k.includes('cancel')) return 'badge-cancelado';
      return 'badge-pendiente';
    }

    function nombreCliente(id) {
      if (id == null) return '—';
      const c = clientes.find(x => x.idCliente === id);
      return c ? `${c.nombres} ${c.apellidos}` : `Cliente #${id}`;
    }

    async function loadCatalogos() {
      try {
        const [resC, resE, resP] = await Promise.all([
          fetch(`${GATEWAY}/api/v1/clientes`, { headers }),
          fetch(`${GATEWAY}/api/v1/estados-pedido`, { headers }),
          fetch(`${GATEWAY}/api/v1/productos`, { headers }),
        ]);
        clientes  = (await resC.json()).data || [];
        estados   = (await resE.json()).data || [];
        productos = (await resP.json()).data || [];
      } catch { showToast('No se pudieron cargar clientes, estados o productos', 'error'); }

      const selCli = document.getElementById('fCliente');
      clientes.forEach(c => {
        const o = document.createElement('option');
        o.value = c.idCliente; o.textContent = `${c.nombres} ${c.apellidos}`; selCli.appendChild(o);
      });
      ['fEstado', 'patchEstado', 'filterEstado'].forEach(id => {
        const sel = document.getElementById(id);
        estados.forEach(e => {
          const o = document.createElement('option');
          o.value = e.idEstadoPedido; o.textContent = e.nombre; sel.appendChild(o);
        });
      });
    }

    async function loadPedidos() {
      const tbody = document.getElementById('pedidosBody');
      try {
        const res = await fetch(`${GATEWAY}/api/v1/pedidos`, { headers });
        if (res.status === 401) { window.location.href = '../index.html'; return; }
        pedidos = (await res.json()).data || [];
        applyFilters();
        loadTotales();
      } catch {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:#A09890;">Error al cargar</td></tr>`;
      }
    }

    // El total no viene en el pedido: se suma desde sus detalles
    async function loadTotales() {
      await Promise.all(pedidos.map(async p => {
        try {
          const res = await fetch(`${GATEWAY}/api/v1/detalle-pedidos/pedido/${p.idPedido}`, { headers });
          const detalles = (await res.json()).data || [];
          totales[p.idPedido] = detalles.reduce((s, d) => s + parseFloat(d.subtotal || 0), 0);
        } catch { /* se queda en — */ }
      }));
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const est = document.getElementById('filterEstado').value;
      renderTabla(pedidos.filter(p =>
        (`#${p.idPedido}`.includes(q) || nombreCliente(p.idCliente).toLowerCase().includes(q)) &&
        (!est || String(p.estadoPedido?.idEstadoPedido) === est)
      ));
    }

    function renderTabla(data) {
      const tbody = document.getElementById('pedidosBody');
      document.getElementById('countLabel').textContent = `${data.length} registro${data.length !== 1 ? 's' : ''}`;
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:#A09890;">Sin pedidos</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(p => {
        const nombreEstado = p.estadoPedido?.nombre || '—';
        const fecha = p.fechaPedido ? new Date(p.fechaPedido).toLocaleDateString('es-PE') : '—';
        const total = totales[p.idPedido] != null ? `S/ ${totales[p.idPedido].toFixed(2)}` : '—';
        return `<tr>
          <td class="td-id">#${p.idPedido}</td>
          <td class="td-bold">${nombreCliente(p.idCliente)}</td>
          <td class="td-muted">${fecha}</td>
          <td class="td-bold">${total}</td>
          <td><span class="badge ${badgeFor(nombreEstado)}">${nombreEstado}</span></td>
          <td class="td-muted">${p.observaciones || '—'}</td>
          <td>
            <button class="action-btn" onclick="openPatch(${p.idPedido}, ${p.estadoPedido?.idEstadoPedido ?? 'null'})" title="Cambiar estado">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <button class="action-btn delete" onclick="openConfirm(${p.idPedido})" title="Eliminar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </td>
        </tr>`;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('filterEstado').addEventListener('change', applyFilters);


    // ------------- Filas de productos del pedido -----------------
    const idDe = p => p.idProducto ?? p.id;
    function precioDe(id) {
      const p = productos.find(x => String(idDe(x)) === String(id));
      return p ? parseFloat(p.precio) : 0;
    }

    function recalcular() {
      let total = 0;
      document.querySelectorAll('.item-row').forEach(row => {
        const sub = precioDe(row.querySelector('.item-producto').value)
                  * (parseInt(row.querySelector('.item-cantidad').value) || 0);
        row.querySelector('.item-subtotal').textContent = `S/ ${sub.toFixed(2)}`;
        total += sub;
      });
      document.getElementById('totalPedido').textContent = `S/ ${total.toFixed(2)}`;
    }

    function addItemRow() {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <select class="form-input item-producto">
          <option value="">— Producto —</option>
          ${productos.filter(p => p.disponible !== false)
            .map(p => `<option value="${idDe(p)}">${p.nombre} — S/ ${parseFloat(p.precio).toFixed(2)}</option>`).join('')}
        </select>
        <input type="number" class="form-input item-cantidad" value="1" min="1" style="max-width:80px;" />
        <span class="item-subtotal">S/ 0.00</span>
        <button type="button" class="item-remove" title="Quitar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>`;
      row.querySelector('.item-producto').addEventListener('change', recalcular);
      row.querySelector('.item-cantidad').addEventListener('input', recalcular);
      row.querySelector('.item-remove').addEventListener('click', () => { row.remove(); recalcular(); });
      document.getElementById('itemsList').appendChild(row);
    }
    document.getElementById('btnAddItem').addEventListener('click', addItemRow);

    // -------------------- Crear -------------
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.getElementById('fCliente').value = '';
      document.getElementById('fObservaciones').value = '';
      document.getElementById('itemsList').innerHTML = '';
      document.getElementById('totalPedido').textContent = 'S/ 0.00';
    }
    document.getElementById('btnCancelar').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.getElementById('btnNuevo').addEventListener('click', async () => {
      if (!productos.length) {
        try {
          const res = await fetch(`${GATEWAY}/api/v1/productos`, { headers });
          productos = (await res.json()).data || [];
        } catch { /* sigue vacío */ }
      }
      if (!productos.length) {
        showToast('No se pudieron cargar los productos. Verifica que ms-inventario (8085) esté en ejecución', 'error');
        return;
      }
      addItemRow();
      document.getElementById('modalOverlay').classList.add('open');
    });

    document.getElementById('btnGuardar').addEventListener('click', async () => {
      const idEstadoPedido = document.getElementById('fEstado').value;
      if (!idEstadoPedido) { showToast('El estado es obligatorio', 'error'); return; }

      const items = [...document.querySelectorAll('.item-row')].map(row => ({
        idProducto: parseInt(row.querySelector('.item-producto').value),
        cantidad: parseInt(row.querySelector('.item-cantidad').value),
      })).filter(i => i.idProducto && i.cantidad > 0);
      if (!items.length) { showToast('Agrega al menos un producto', 'error'); return; }

      const idCliente = document.getElementById('fCliente').value;
      const body = {
        idCliente: idCliente ? parseInt(idCliente) : null,
        idEmpleado: 1,
        idEstadoPedido: parseInt(idEstadoPedido),
        observaciones: document.getElementById('fObservaciones').value.trim() || null,
      };

      try {
        const res = await fetch(`${GATEWAY}/api/v1/pedidos`, { method: 'POST', headers, body: JSON.stringify(body) });
        if (!res.ok) throw new Error();
        const idPedido = (await res.json()).data.idPedido;

        let fallidos = 0;
        for (const it of items) {
          const r = await fetch(`${GATEWAY}/api/v1/detalle-pedidos`, {
            method: 'POST', headers,
            body: JSON.stringify({ idPedido, idProducto: it.idProducto, cantidad: it.cantidad, precioUnitario: precioDe(it.idProducto) })
          });
          if (!r.ok) fallidos++;
        }
        showToast(fallidos ? `Pedido creado, pero ${fallidos} producto(s) no se pudieron agregar` : 'Pedido creado',
                  fallidos ? 'error' : 'success');
        closeModal();
        await loadPedidos();
      } catch { showToast('Error al crear el pedido', 'error'); }
    });

    // ------------- Eliminar ---------------
    function openConfirm(id) {
      deleteId = id;
      document.getElementById('confirmOverlay').classList.add('open');
    }
    document.getElementById('confirmCancelar').addEventListener('click', () => {
      document.getElementById('confirmOverlay').classList.remove('open');
      deleteId = null;
    });
    document.getElementById('confirmEliminar').addEventListener('click', async () => {
      if (!deleteId) return;
      try {
        const res = await fetch(`${GATEWAY}/api/v1/pedidos/${deleteId}`, { method: 'DELETE', headers });
        if (!res.ok) throw new Error();
        showToast('Pedido eliminado');
        document.getElementById('confirmOverlay').classList.remove('open');
        deleteId = null;
        await loadPedidos();
      } catch { showToast('Error al eliminar', 'error'); }
    });

    loadCatalogos().then(loadPedidos);
</script>
</body>
</html>
