<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mantenimiento — SIGESCA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
        .tabs { display:flex; gap:4px; margin-bottom:24px; background:var(--blanco-hueso); border-radius:8px; padding:4px; border:1px solid rgba(0,0,0,0.05); width:fit-content; }
        .tab-btn { padding:8px 20px; border:none; border-radius:6px; font-family:'Inter',sans-serif; font-size:13px; font-weight:500; cursor:pointer; background:transparent; color:#7A7068; transition:background 0.15s,color 0.15s; }
        .tab-btn.active { background:var(--verde-profundo); color:#F5F0E8; }
    </style>
</head>
<body data-page="mantenimiento">
<aside class="sidebar" id="sidebar-root"></aside>

<main class="main-content">
    <div class="page-header">
        <div>
            <h1>Mantenimiento</h1>
            <p>Equipos y registros de mantenimiento de Sinergia Café</p>
        </div>
        <button class="btn-primary" id="btnNuevo">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span id="btnNuevoLabel">Nuevo equipo</span>
        </button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabEquipos" onclick="switchTab('equipos')">Equipos</button>
        <button class="tab-btn" id="tabMantenimientos" onclick="switchTab('mantenimientos')">Mantenimientos</button>
    </div>

    <div class="filters">
        <div class="search-wrapper">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Buscar…" />
        </div>
        <span class="count-label" id="countLabel"></span>
    </div>

    <!-- Tabla Equipos -->
    <div id="panelEquipos" class="table-container">
        <table>
            <thead>
            <tr><th>ID</th><th>Nombre</th><th>Tipo</th><th>Marca</th><th>Modelo</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody id="equiposBody">
            <tr><td colspan="7" style="text-align:center;padding:40px;color:#A09890;">Cargando…</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Tabla Mantenimientos -->
    <div id="panelMantenimientos" class="table-container" style="display:none;">
        <table>
            <thead>
            <tr><th>ID</th><th>Equipo</th><th>Tipo</th><th>Fecha</th><th>Técnico</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody id="mantenimientosBody">
            <tr><td colspan="7" style="text-align:center;padding:40px;color:#A09890;">Cargando…</td></tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Modal Equipo -->
<div class="modal-overlay" id="modalEquipo">
    <div class="modal">
        <h2 class="modal-title" id="modalEquipoTitle">Nuevo equipo</h2>
        <input type="hidden" id="equipoId" />
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Nombre *</label>
                <input type="text" class="form-input" id="eqNombre" placeholder="Ej: Cafetera espresso" />
            </div>
            <div class="form-group">
                <label class="form-label">Tipo de equipo *</label>
                <select class="form-input" id="eqTipo">
                    <option value="">— Seleccionar —</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Marca</label>
                <input type="text" class="form-input" id="eqMarca" placeholder="Ej: La Marzocco" />
            </div>
            <div class="form-group">
                <label class="form-label">Modelo</label>
                <input type="text" class="form-input" id="eqModelo" placeholder="Ej: Linea Mini" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">N° de serie</label>
                <input type="text" class="form-input" id="eqSerie" placeholder="SN-XXXXXXXX" />
            </div>
            <div class="form-group">
                <label class="form-label">Fecha de compra</label>
                <input type="date" class="form-input" id="eqFechaCompra" />
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" id="btnCancelarEquipo">Cancelar</button>
            <button class="btn-primary" id="btnGuardarEquipo">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal Mantenimiento -->
<div class="modal-overlay" id="modalMantenimiento">
    <div class="modal">
        <h2 class="modal-title" id="modalMantenimientoTitle">Registrar mantenimiento</h2>
        <input type="hidden" id="mantenimientoId" />
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Equipo *</label>
                <select class="form-input" id="mtEquipo">
                    <option value="">— Seleccionar —</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Tipo de mantenimiento *</label>
                <select class="form-input" id="mtTipo">
                    <option value="">— Seleccionar —</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Fecha programada *</label>
                <input type="date" class="form-input" id="mtFecha" />
            </div>
            <div class="form-group">
                <label class="form-label">Técnico</label>
                <input type="text" class="form-input" id="mtTecnico" placeholder="Nombre del técnico" />
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Descripción</label>
            <input type="text" class="form-input" id="mtDescripcion" placeholder="Detalle del trabajo a realizar…" />
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" id="btnCancelarMantenimiento">Cancelar</button>
            <button class="btn-primary" id="btnGuardarMantenimiento">Guardar</button>
        </div>
    </div>
</div>

<!-- Patch estado mantenimiento -->
<div class="patch-overlay" id="patchOverlay">
    <div class="patch-box">
        <h3>Cambiar estado</h3>
        <input type="hidden" id="patchId" />
        <div class="form-group">
            <label class="form-label">Nuevo estado</label>
            <select class="form-input" id="patchEstado">
                <option value="programado">Programado</option>
                <option value="en_proceso">En proceso</option>
                <option value="completado">Completado</option>
                <option value="cancelado">Cancelado</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" id="patchCancelar">Cancelar</button>
            <button class="btn-primary" id="patchGuardar">Actualizar</button>
        </div>
    </div>
</div>

<!-- Confirm eliminar -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <h3 id="confirmTitle">Eliminar</h3>
        <p>¿Estás seguro? Esta acción no se puede deshacer.</p>
        <div style="display:flex;gap:10px;justify-content:center;">
            <button class="btn-secondary" id="confirmCancelar">Cancelar</button>
            <button class="btn-danger" id="confirmEliminar">Eliminar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="../components/sidebar.js"></script>
<script>
    const GATEWAY = 'http://localhost:8080';
    const headers = getHeaders();

    let equipos = [], tiposEquipo = [], mantenimientos = [], tiposMantenimiento = [];
    let tabActual = 'equipos';
    let deleteId = null, deleteType = null;

    const estadoMtMap = {
      programado: { label: 'Programado', cls: 'badge-pendiente' },
      en_proceso:  { label: 'En proceso', cls: 'badge-preparacion' },
      completado:  { label: 'Completado', cls: 'badge-activo' },
      cancelado:   { label: 'Cancelado',  cls: 'badge-cancelado' },
    };

    const estadoEquipoMap = {
      operativo:    { label: 'Operativo',    cls: 'badge-operativo' },
      mantenimiento:{ label: 'Mantenimiento',cls: 'badge-mantenimiento' },
      inoperativo:  { label: 'Inoperativo',  cls: 'badge-inoperativo' },
    };

    // ---------------- Tabs -----------------
    function switchTab(tab) {
      tabActual = tab;
      ['equipos','mantenimientos'].forEach(t => {
        document.getElementById(`panel${t.charAt(0).toUpperCase()+t.slice(1)}`).style.display = t === tab ? '' : 'none';
        document.getElementById(`tab${t.charAt(0).toUpperCase()+t.slice(1)}`).className = `tab-btn ${t === tab ? 'active' : ''}`;
      });
      document.getElementById('btnNuevoLabel').textContent = tab === 'equipos' ? 'Nuevo equipo' : 'Registrar mantenimiento';
      document.getElementById('searchInput').value = '';
      renderTablaActual();
    }

    function renderTablaActual() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      if (tabActual === 'equipos') renderEquipos(equipos.filter(e => e.nombre?.toLowerCase().includes(q)));
      else renderMantenimientos(mantenimientos.filter(m => m.equipo?.nombre?.toLowerCase().includes(q)));
    }

    document.getElementById('searchInput').addEventListener('input', renderTablaActual);
    document.getElementById('btnNuevo').addEventListener('click', () => {
      if (tabActual === 'equipos') openModalEquipo();
      else openModalMantenimiento();
    });

    // ---------------- Cargar datos -------------------
    async function loadAll() {
      try {
        const [resE, resTe, resMt, resTm] = await Promise.all([
          fetch(`${GATEWAY}/api/v1/equipos`, { headers }),
          fetch(`${GATEWAY}/api/v1/tipos-equipo`, { headers }),
          fetch(`${GATEWAY}/api/v1/mantenimientos`, { headers }),
          fetch(`${GATEWAY}/api/v1/tipos-mantenimiento`, { headers }),
        ]);
        if (resE.status === 401) { window.location.href = '../index.html'; return; }

        equipos = (await resE.json()).data || [];
        tiposEquipo = (await resTe.json()).data || [];
        mantenimientos = (await resMt.json()).data || [];
        tiposMantenimiento = (await resTm.json()).data || [];

        const selTipoEq = document.getElementById('eqTipo');
        tiposEquipo.forEach(t => {
          const o = document.createElement('option');
          o.value = t.idTipoEquipo; o.textContent = t.nombre; selTipoEq.appendChild(o);
        });

        const selEquipo = document.getElementById('mtEquipo');
        equipos.forEach(e => {
          const o = document.createElement('option');
          o.value = e.idEquipo; o.textContent = e.nombre; selEquipo.appendChild(o);
        });

        const selTipoMt = document.getElementById('mtTipo');
        tiposMantenimiento.forEach(t => {
          const o = document.createElement('option');
          o.value = t.idTipoMantenimiento; o.textContent = t.nombre; selTipoMt.appendChild(o);
        });

        renderEquipos(equipos);
      } catch { showToast('Error al cargar datos', 'error'); }
    }

    // ---------------- Equipos -------------------
    function renderEquipos(data) {
      const tbody = document.getElementById('equiposBody');
      document.getElementById('countLabel').textContent = `${data.length} registro${data.length !== 1 ? 's' : ''}`;
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:#A09890;">Sin equipos</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(e => {
        const estado = estadoEquipoMap[e.estado] || { label: e.estado || '—', cls: 'badge-pendiente' };
        return `<tr>
          <td class="td-id">#${e.idEquipo}</td>
          <td class="td-bold">${e.nombre}</td>
          <td>${e.tipoEquipo?.nombre || '—'}</td>
          <td>${e.marca || '—'}</td>
          <td>${e.modelo || '—'}</td>
          <td><span class="badge ${estado.cls}">${estado.label}</span></td>
          <td>
            <button class="action-btn" onclick="openEditEquipo(${e.idEquipo})" title="Editar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="action-btn delete" onclick="openConfirm(${e.idEquipo},'equipo')" title="Eliminar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </td>
        </tr>`;
      }).join('');
    }

    // ----------- Mantenimientos -------------------
    function renderMantenimientos(data) {
      const tbody = document.getElementById('mantenimientosBody');
      document.getElementById('countLabel').textContent = `${data.length} registro${data.length !== 1 ? 's' : ''}`;
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:#A09890;">Sin mantenimientos</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(m => {
        const e = estadoMtMap[m.estado] || { label: m.estado || '—', cls: 'badge-pendiente' };
        const fecha = m.fechaProgramada ? new Date(m.fechaProgramada).toLocaleDateString('es-PE') : '—';
        return `<tr>
          <td class="td-id">#${m.idMantenimiento}</td>
          <td class="td-bold">${m.equipo?.nombre || '—'}</td>
          <td>${m.tipoMantenimiento?.nombre || '—'}</td>
          <td class="td-muted">${fecha}</td>
          <td>${m.tecnico || '—'}</td>
          <td><span class="badge ${e.cls}">${e.label}</span></td>
          <td>
            <button class="action-btn" onclick="openPatch(${m.idMantenimiento},'${m.estado}')" title="Cambiar estado">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <button class="action-btn" onclick="openEditMantenimiento(${m.idMantenimiento})" title="Editar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="action-btn delete" onclick="openConfirm(${m.idMantenimiento},'mantenimiento')" title="Eliminar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </td>
        </tr>`;
      }).join('');
    }

    // ------------- Modal Equipo -----------------
    function openModalEquipo(eq = null) {
      document.getElementById('modalEquipoTitle').textContent = eq ? 'Editar equipo' : 'Nuevo equipo';
      document.getElementById('equipoId').value = eq?.idEquipo || '';
      document.getElementById('eqNombre').value = eq?.nombre || '';
      document.getElementById('eqTipo').value = eq?.tipoEquipo?.idTipoEquipo || '';
      document.getElementById('eqMarca').value = eq?.marca || '';
      document.getElementById('eqModelo').value = eq?.modelo || '';
      document.getElementById('eqSerie').value = eq?.numeroSerie || '';
      document.getElementById('eqFechaCompra').value = eq?.fechaCompra?.split('T')[0] || '';
      document.getElementById('modalEquipo').classList.add('open');
    }

    function openEditEquipo(id) {
      const e = equipos.find(x => x.idEquipo === id);
      if (e) openModalEquipo(e);
    }

    function closeModalEquipo() { document.getElementById('modalEquipo').classList.remove('open'); }
    document.getElementById('btnCancelarEquipo').addEventListener('click', closeModalEquipo);
    document.getElementById('modalEquipo').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModalEquipo();
    });

    document.getElementById('btnGuardarEquipo').addEventListener('click', async () => {
      const id = document.getElementById('equipoId').value;
      const nombre = document.getElementById('eqNombre').value.trim();
      const idTipoEquipo = document.getElementById('eqTipo').value;
      if (!nombre || !idTipoEquipo) { showToast('Nombre y tipo son obligatorios', 'error'); return; }
      const body = {
        nombre,
        idTipoEquipo: parseInt(idTipoEquipo),
        marca: document.getElementById('eqMarca').value.trim() || null,
        modelo: document.getElementById('eqModelo').value.trim() || null,
        numeroSerie: document.getElementById('eqSerie').value.trim() || null,
        fechaCompra: document.getElementById('eqFechaCompra').value || null,
      };
      try {
        const res = await fetch(
          `${GATEWAY}/api/v1/equipos${id ? '/' + id : ''}`,
          { method: id ? 'PUT' : 'POST', headers, body: JSON.stringify(body) }
        );
        if (!res.ok) throw new Error();
        showToast(id ? 'Equipo actualizado' : 'Equipo creado');
        closeModalEquipo();
        const json = await (await fetch(`${GATEWAY}/api/v1/equipos`, { headers })).json();
        equipos = json.data || [];
        renderEquipos(equipos);
      } catch { showToast('Error al guardar', 'error'); }
    });

    // ----------- Modal Mantenimiento --------------------
    function openModalMantenimiento(mt = null) {
      document.getElementById('modalMantenimientoTitle').textContent = mt ? 'Editar mantenimiento' : 'Registrar mantenimiento';
      document.getElementById('mantenimientoId').value = mt?.idMantenimiento || '';
      document.getElementById('mtEquipo').value = mt?.equipo?.idEquipo || '';
      document.getElementById('mtTipo').value = mt?.tipoMantenimiento?.idTipoMantenimiento || '';
      document.getElementById('mtFecha').value = mt?.fechaProgramada?.split('T')[0] || '';
      document.getElementById('mtTecnico').value = mt?.tecnico || '';
      document.getElementById('mtDescripcion').value = mt?.descripcion || '';
      document.getElementById('modalMantenimiento').classList.add('open');
    }

    function openEditMantenimiento(id) {
      const m = mantenimientos.find(x => x.idMantenimiento === id);
      if (m) openModalMantenimiento(m);
    }

    function closeModalMantenimiento() { document.getElementById('modalMantenimiento').classList.remove('open'); }
    document.getElementById('btnCancelarMantenimiento').addEventListener('click', closeModalMantenimiento);
    document.getElementById('modalMantenimiento').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModalMantenimiento();
    });

    document.getElementById('btnGuardarMantenimiento').addEventListener('click', async () => {
      const id = document.getElementById('mantenimientoId').value;
      const idEquipo = document.getElementById('mtEquipo').value;
      const idTipoMantenimiento = document.getElementById('mtTipo').value;
      const fechaProgramada = document.getElementById('mtFecha').value;
      if (!idEquipo || !idTipoMantenimiento || !fechaProgramada) {
        showToast('Equipo, tipo y fecha son obligatorios', 'error'); return;
      }
      const body = {
        idEquipo: parseInt(idEquipo),
        idTipoMantenimiento: parseInt(idTipoMantenimiento),
        fechaProgramada,
        tecnico: document.getElementById('mtTecnico').value.trim() || null,
        descripcion: document.getElementById('mtDescripcion').value.trim() || null,
      };
      try {
        const res = await fetch(
          `${GATEWAY}/api/v1/mantenimientos${id ? '/' + id : ''}`,
          { method: id ? 'PUT' : 'POST', headers, body: JSON.stringify(body) }
        );
        if (!res.ok) throw new Error();
        showToast(id ? 'Mantenimiento actualizado' : 'Mantenimiento registrado');
        closeModalMantenimiento();
        const json = await (await fetch(`${GATEWAY}/api/v1/mantenimientos`, { headers })).json();
        mantenimientos = json.data || [];
        renderMantenimientos(mantenimientos);
      } catch { showToast('Error al guardar', 'error'); }
    });

    // -------------- Patch estado --------------------
    function openPatch(id, estadoActual) {
      document.getElementById('patchId').value = id;
      document.getElementById('patchEstado').value = estadoActual || 'programado';
      document.getElementById('patchOverlay').classList.add('open');
    }
    document.getElementById('patchCancelar').addEventListener('click', () =>
      document.getElementById('patchOverlay').classList.remove('open'));
    document.getElementById('patchGuardar').addEventListener('click', async () => {
      const id = document.getElementById('patchId').value;
      const estado = document.getElementById('patchEstado').value;
      try {
        const res = await fetch(`${GATEWAY}/api/v1/mantenimientos/${id}/estado/${estado}`, { method: 'PATCH', headers });
        if (!res.ok) throw new Error();
        showToast('Estado actualizado');
        document.getElementById('patchOverlay').classList.remove('open');
        const json = await (await fetch(`${GATEWAY}/api/v1/mantenimientos`, { headers })).json();
        mantenimientos = json.data || [];
        renderMantenimientos(mantenimientos);
      } catch { showToast('Error al actualizar estado', 'error'); }
    });

    // ---------- Confirm eliminar ----------
    const endpointMap = {
      equipo: '/api/v1/equipos',
      mantenimiento: '/api/v1/mantenimientos',
    };

    function openConfirm(id, type) {
      deleteId = id; deleteType = type;
      document.getElementById('confirmTitle').textContent =
        `Eliminar ${type === 'equipo' ? 'equipo' : 'mantenimiento'}`;
      document.getElementById('confirmOverlay').classList.add('open');
    }
    document.getElementById('confirmCancelar').addEventListener('click', () => {
      document.getElementById('confirmOverlay').classList.remove('open');
      deleteId = null; deleteType = null;
    });
    document.getElementById('confirmEliminar').addEventListener('click', async () => {
      if (!deleteId) return;
      try {
        const res = await fetch(`${GATEWAY}${endpointMap[deleteType]}/${deleteId}`, { method: 'DELETE', headers });
        if (!res.ok) throw new Error();
        showToast('Eliminado correctamente');
        document.getElementById('confirmOverlay').classList.remove('open');
        deleteId = null; deleteType = null;
        await loadAll();
        renderTablaActual();
      } catch { showToast('Error al eliminar', 'error'); }
    });

    loadAll();
</script>
</body>
</html>
